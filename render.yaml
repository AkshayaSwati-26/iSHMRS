services:
  - type: web
    name: ishrms-backend
    env: node
    buildCommand: cd backend && npm install && npx prisma db push
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
